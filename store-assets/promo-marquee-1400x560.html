<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Marquee promo tile</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 1350px; height: 540px; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #canvas {
    position: relative; width: 1400px; height: 560px;
    transform: scale(0.9643); transform-origin: top left;
    background:
      radial-gradient(55% 90% at 88% 30%, rgba(209,70,111,0.30) 0%, transparent 60%),
      radial-gradient(60% 80% at 0% 100%, #fff7ec 0%, transparent 55%),
      #fff0f3;
  }
  .lockup { position: absolute; left: 90px; top: 128px; display: flex; align-items: center; gap: 16px; }
  .lockup img { width: 56px; height: 56px; }
  .lockup span { font-size: 24px; font-weight: 800; color: #2b1620; }
  h1 {
    position: absolute; left: 90px; top: 214px; width: 620px; margin: 0;
    font-size: 52px; line-height: 1.12; font-weight: 800; color: #2b1620; letter-spacing: -0.5px;
  }
  p {
    position: absolute; left: 90px; top: 372px; width: 560px; margin: 0;
    font-size: 20px; line-height: 1.5; color: #6b525a;
  }
  .sites {
    position: absolute; left: 90px; top: 452px;
    font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #d1466f;
  }
  .glow {
    position: absolute; right: 100px; top: 50%; transform: translateY(-50%);
    width: 340px; height: 340px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,255,255,0.55), rgba(255,255,255,0) 72%);
    display: flex; align-items: center; justify-content: center;
  }
  .glow img { width: 190px; height: 190px; filter: drop-shadow(0 30px 50px rgba(60,20,40,0.28)); }
</style>
</head>
<body>
<div id="canvas">
  <div class="lockup">
    <img src="../icons/icon48.png" alt="" />
    <span>Bunny Skip</span>
  </div>
  <h1>Never reach for the remote again</h1>
  <p>Bunny Skip clicks Skip Intro, Skip Recap, and Next Episode automatically — with rules you can see and edit yourself.</p>
  <div class="sites">Netflix &middot; Prime Video &middot; Disney+</div>
  <div class="glow"><img src="../icons/icon128.png" alt="" /></div>
</div>
</body>
</html>
