<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Small promo tile</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 440px; height: 280px; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    position: relative;
    background:
      radial-gradient(70% 90% at 85% 100%, rgba(209,70,111,0.28) 0%, transparent 60%),
      radial-gradient(60% 70% at 0% 0%, #fff7ec 0%, transparent 55%),
      #fff0f3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  img.icon { width: 84px; height: 84px; margin-bottom: 14px; filter: drop-shadow(0 10px 18px rgba(60,20,40,0.22)); }
  h1 {
    margin: 0 0 8px; font-size: 27px; font-weight: 800; color: #2b1620; letter-spacing: -0.3px;
  }
  p {
    margin: 0; font-size: 14px; color: #6b525a; max-width: 320px; line-height: 1.45;
  }
  .sites {
    margin-top: 16px; font-size: 11px; font-weight: 700; letter-spacing: 1.6px;
    text-transform: uppercase; color: #d1466f;
  }
</style>
</head>
<body>
  <img class="icon" src="../icons/icon128.png" alt="" />
  <h1>Bunny Skip</h1>
  <p>Clicks Skip Intro &amp; Next Episode automatically</p>
  <div class="sites">Netflix &middot; Prime Video &middot; Disney+</div>
</body>
</html>
